apiVersion: v1
kind: Service
metadata:
  name: {{ include "timebase.fullname" . }}-historian
  namespace: {{ .Release.Namespace }}
  labels: {{- include "timebase.labels" . | nindent 4 }}
spec:
  # Headless so collector pods can discover the historian by DNS
  clusterIP: None
  selector: {{- include "timebase.historian.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.historian.port }}
      targetPort: {{ .Values.service.historian.port }}
      name: http
---
# Named ClusterIP service for in-cluster access by collector/explorer
apiVersion: v1
kind: Service
metadata:
  name: {{ include "timebase.fullname" . }}-historian-svc
  namespace: {{ .Release.Namespace }}
  labels: {{- include "timebase.labels" . | nindent 4 }}
spec:
  selector: {{- include "timebase.historian.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.historian.port }}
      targetPort: {{ .Values.service.historian.port }}
      name: http
