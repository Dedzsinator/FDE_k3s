historian:
  image:
    repository: rtlabs/timebase-server
    tag: "6.5"
    pullPolicy: IfNotPresent
  storage:
    data: 20Gi
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

collector:
  image:
    repository: rtlabs/timebase-collector
    tag: "6.5"
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

explorer:
  image:
    repository: rtlabs/timebase-web
    tag: "6.5"
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

service:
  historian:
    port: 8011
  collector:
    port: 8055
  explorer:
    port: 8099

mqtt:
  host: "monstermq"
  port: 1883
  topicPrefix: "#"

global:
  storageClass: ""

nodeSelector: {}
tolerations: []
affinity: {}
