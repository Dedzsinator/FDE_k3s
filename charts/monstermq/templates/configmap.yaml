apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "monstermq.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels: {{- include "monstermq.labels" . | nindent 4 }}
data:
  config.yaml: |
    TCP: {{ .Values.service.mqtt.port }}
    TCPS: {{ .Values.service.mqtts.port }}
    WS: {{ .Values.service.ws.port }}
    WSS: {{ .Values.service.wss.port }}

    DefaultStoreType: POSTGRES

    Postgres:
      Url: jdbc:postgresql://monstermq-postgres.{{ .Release.Namespace }}.svc.cluster.local:5432/{{ .Values.postgres.db }}
      User: {{ .Values.postgres.user }}
      Pass: {{ .Values.postgres.password }}

    Logging:
      Mqtt:
        Enabled: {{ .Values.config.logging.mqtt }}
      Memory:
        Enabled: true
        Entries: {{ .Values.config.logging.memoryEntries }}

    GraphQL:
      Enabled: true
      Port: {{ .Values.service.graphql.port }}
      MqttApi: true

    MCP:
      Enabled: true
      Port: {{ .Values.service.mcp.port }}

    ArchiveGroups:
      - Name: Default
        Filter: "#"
        Enabled: {{ .Values.config.archiveAll }}

    UserManagement:
      Enabled: {{ .Values.config.userManagement }}
      StoreType: POSTGRES
      PasswordAlgorithm: bcrypt
      CacheRefreshInterval: 60
      DisconnectOnUnauthorized: true
