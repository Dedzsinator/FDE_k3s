apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: monstermq-postgres
  namespace: {{ .Release.Namespace }}
  labels: {{- include "monstermq.labels" . | nindent 4 }}
spec:
  serviceName: monstermq-postgres
  replicas: 1
  selector:
    matchLabels: {{- include "monstermq.postgres.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "monstermq.postgres.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: {{ include "monstermq.fullname" . }}-postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources: {{- toYaml .Values.resources.postgres | nindent 12 }}
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      nodeSelector: {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations: {{- toYaml .Values.tolerations | nindent 8 }}
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.global.storageClass | default "local-path" }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
