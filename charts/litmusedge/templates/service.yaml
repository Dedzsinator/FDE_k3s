apiVersion: v1
kind: Service
metadata:
  name: {{ include "litmusedge.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "litmusedge.labels" . | nindent 4 }}
spec:
  selector: {{- include "litmusedge.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.ui.port }}
      targetPort: {{ .Values.service.ui.port }}
      name: ui
