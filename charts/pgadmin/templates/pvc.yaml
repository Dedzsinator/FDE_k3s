apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "pgadmin.fullname" . }}-data
  namespace: {{ .Release.Namespace }}
  labels: {{- include "pgadmin.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.global.storageClass | default "local-path" }}
  resources:
    requests:
      storage: {{ .Values.storage.data }}
