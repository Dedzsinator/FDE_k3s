apiVersion: v1
kind: Service
metadata:
  name: {{ include "pgadmin.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "pgadmin.labels" . | nindent 4 }}
spec:
  selector: {{- include "pgadmin.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      name: http
