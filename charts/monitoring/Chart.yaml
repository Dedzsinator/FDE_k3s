apiVersion: v2
name: monitoring
description: |
  Observability stack — Prometheus, Grafana, AlertManager, Node Exporter,
  kube-state-metrics. Grafana is pre-wired with datasources for Prometheus,
  Loki, and the time-series store (TimeBase / InfluxDB 3).
type: application
version: 0.1.0
appVersion: "60.x"

dependencies:
  - name: kube-prometheus-stack
    version: "~60"
    repository: "https://prometheus-community.github.io/helm-charts"
