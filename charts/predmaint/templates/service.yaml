apiVersion: v1
kind: Service
metadata:
  name: {{ include "predmaint.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "predmaint.labels" . | nindent 4 }}
spec:
  selector: {{- include "predmaint.selectorLabels" . | nindent 4 }}
  ports:
    - name: mcp
      port: {{ .Values.service.port }}
      targetPort: mcp
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
