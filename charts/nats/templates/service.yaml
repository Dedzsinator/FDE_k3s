apiVersion: v1
kind: Service
metadata:
  name: {{ include "nats.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "nats.labels" . | nindent 4 }}
spec:
  selector: {{- include "nats.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.client.port }}
      targetPort: {{ .Values.service.client.port }}
      name: client
    - port: {{ .Values.service.mqtt.port }}
      targetPort: {{ .Values.service.mqtt.port }}
      name: mqtt
    - port: {{ .Values.service.monitor.port }}
      targetPort: {{ .Values.service.monitor.port }}
      name: monitor
---
# Headless service for StatefulSet DNS — used by cluster route discovery
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nats.fullname" . }}-headless
  namespace: {{ .Release.Namespace }}
  labels: {{- include "nats.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "nats.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.cluster.port }}
      targetPort: {{ .Values.service.cluster.port }}
      name: cluster
---
# NodePort — raw MQTT for out-of-cluster OT devices (Ignition, LitmusEdge, external sims)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nats.fullname" . }}-ext
  namespace: {{ .Release.Namespace }}
  labels: {{- include "nats.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector: {{- include "nats.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.mqtt.port }}
      targetPort: {{ .Values.service.mqtt.port }}
      nodePort: {{ .Values.nodePort.mqtt }}
      name: mqtt
