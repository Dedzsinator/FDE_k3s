apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "apache-age.fullname" . }}-init
  namespace: {{ .Release.Namespace }}
  labels: {{- include "apache-age.labels" . | nindent 4 }}
data:
  # Bootstrap graph schema for factory topology
  01-age-init.sql: |
    CREATE EXTENSION IF NOT EXISTS age;
    LOAD 'age';
    SET search_path = ag_catalog, "$user", public;

    -- Factory topology graph
    SELECT create_graph('factory');

    -- Equipment node labels
    SELECT create_vlabel('factory', 'Equipment');
    SELECT create_vlabel('factory', 'Sensor');
    SELECT create_vlabel('factory', 'Cell');
    SELECT create_vlabel('factory', 'Line');

    -- Relationship types
    SELECT create_elabel('factory', 'HAS_SENSOR');
    SELECT create_elabel('factory', 'BELONGS_TO_CELL');
    SELECT create_elabel('factory', 'FEEDS_INTO');
    SELECT create_elabel('factory', 'MAINTAINED_BY');
    SELECT create_elabel('factory', 'REPLACED_BY');

    -- Example query to use from application:
    -- SELECT * FROM cypher('factory', $$
    --   MATCH (e:Equipment)-[:HAS_SENSOR]->(s:Sensor)
    --   WHERE s.tag = 'co2_pct'
    --   RETURN e.name, s.last_value
    -- $$) AS (equipment agtype, last_value agtype);
