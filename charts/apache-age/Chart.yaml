apiVersion: v2
name: apache-age
description: |
  Apache AGE on PostgreSQL — Apache 2.0 graph database.
  Replaces Memgraph/Neo4j. OpenCypher graph queries on top of PostgreSQL ACID.
  Citus extension available for horizontal sharding.
  Connects to NATS via logical replication for live topology updates.
type: application
version: 0.1.0
appVersion: "1.5"
